<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">ResearchOS illustrated multi-agent research architecture</title>
  <desc id="desc">Illustrated architecture showing a researcher interacting with the ResearchOS coordinator, evidence services, specialized research agents, verification, academic writing, and persistent research memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#183b56"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f8f83"/></marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dd684d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#183b56" flood-opacity="0.14"/></filter>
    <linearGradient id="sky" x1="0" x2="1"><stop stop-color="#eef7fb"/><stop offset="1" stop-color="#f8fbfd"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#176b88"/><stop offset="1" stop-color="#0d897d"/></linearGradient>
    <style>
      .title{font:700 31px Arial,Helvetica,sans-serif;fill:#102f48}.subtitle{font:400 14px Arial,Helvetica,sans-serif;fill:#5b7083}
      .eyebrow{font:700 11px Arial,Helvetica,sans-serif;letter-spacing:1.3px;fill:#607789}.section{font:700 18px Arial,Helvetica,sans-serif;fill:#143650}
      .label{font:700 13px Arial,Helvetica,sans-serif;fill:#143650}.copy{font:400 11px Arial,Helvetica,sans-serif;fill:#5b7083}
      .white-title{font:700 18px Arial,Helvetica,sans-serif;fill:#fff}.white-copy{font:400 11px Arial,Helvetica,sans-serif;fill:#dff3ef}
      .agent-title{font:700 12.5px Arial,Helvetica,sans-serif;fill:#143650}.agent-copy{font:400 10.5px Arial,Helvetica,sans-serif;fill:#62778a}
      .num{font:700 11px Arial,Helvetica,sans-serif;fill:#fff}.tiny{font:400 10px Arial,Helvetica,sans-serif;fill:#607789}
      .panel{fill:#fff;stroke:#bdccd7;stroke-width:1.2}.soft{fill:#f6f9fb;stroke:#cbd6df;stroke-width:1.1}
      .flow{fill:none;stroke:#183b56;stroke-width:2;marker-end:url(#arrow)}.evidence{fill:none;stroke:#0f8f83;stroke-width:2.2;marker-end:url(#arrow-teal)}
      .feedback{fill:none;stroke:#dd684d;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow-coral)}.link{fill:none;stroke:#8fa1b0;stroke-width:1.4;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#fff"/>
  <text x="800" y="42" text-anchor="middle" class="title">ResearchOS: Illustrated Evidence-Grounded Multi-Agent Architecture</text>
  <text x="800" y="68" text-anchor="middle" class="subtitle">A human-guided research workspace where specialized agents discover, reason, evaluate, verify, and write from traceable evidence</text>

  <!-- Researcher -->
  <rect x="55" y="105" width="245" height="158" rx="12" fill="#f7fafc" stroke="#bdccd7"/>
  <circle cx="105" cy="147" r="20" fill="#183b56"/>
  <path d="M69 212c3-31 18-48 36-48s33 17 36 48" fill="#183b56"/>
  <rect x="152" y="129" width="122" height="81" rx="7" fill="#fff" stroke="#93a8b7"/>
  <path d="M163 145h79M163 160h92M163 175h65" stroke="#9aabb8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="262" cy="198" r="13" fill="#0f8f83"/><path d="M256 198h12M262 192v12" stroke="#fff" stroke-width="2"/>
  <text x="177" y="234" text-anchor="middle" class="label">Researcher + Project Workspace</text>
  <text x="177" y="251" text-anchor="middle" class="copy">goal, documents, data, constraints, feedback</text>

  <!-- External services -->
  <rect x="1300" y="105" width="245" height="158" rx="12" fill="#f7fafc" stroke="#bdccd7"/>
  <path d="M1340 177c0-17 13-31 30-32 6-21 25-35 48-35 27 0 49 20 51 46 17 1 31 15 31 32 0 18-15 33-33 33h-94c-18 0-33-15-33-33z" fill="#fff" stroke="#7891a3" stroke-width="2"/>
  <circle cx="1393" cy="176" r="25" fill="#eaf2ff" stroke="#7298e8"/><text x="1393" y="181" text-anchor="middle" class="label">LLM</text>
  <circle cx="1450" cy="176" r="25" fill="#edf8f5" stroke="#64aca4"/><text x="1450" y="181" text-anchor="middle" class="label">API</text>
  <text x="1422" y="234" text-anchor="middle" class="label">External Research Services</text>
  <text x="1422" y="251" text-anchor="middle" class="copy">models, scholarly search, tools, code runtime</text>

  <!-- Main runtime -->
  <rect x="55" y="292" width="1490" height="576" rx="16" fill="url(#sky)" stroke="#adc1cf" stroke-width="1.4"/>
  <text x="80" y="321" class="eyebrow">RESEARCHOS AGENT RUNTIME</text>
  <text x="80" y="348" class="section">Coordinated research with evidence and verification at every stage</text>

  <!-- Input and service arrows -->
  <path d="M177 263V292" class="flow"/><text x="190" y="283" class="tiny">request + context</text>
  <path d="M1422 263V292" class="flow"/><text x="1437" y="283" class="tiny">interact</text>

  <!-- Evidence side -->
  <rect x="82" y="378" width="295" height="431" rx="12" class="panel" filter="url(#shadow)"/>
  <circle cx="111" cy="410" r="15" fill="#2f6fed"/><text x="111" y="414" text-anchor="middle" class="num">1</text><text x="137" y="416" class="section">Evidence Workspace</text>
  <g transform="translate(105 448)">
    <path d="M0 0h55l22 22v72H0z" fill="#eef4ff" stroke="#7197e5" stroke-width="1.6"/><path d="M55 0v22h22" fill="none" stroke="#7197e5" stroke-width="1.6"/><path d="M14 42h48M14 57h48M14 72h34" stroke="#7197e5" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(220 449)">
    <ellipse cx="48" cy="14" rx="45" ry="14" fill="#e8f7f3" stroke="#58a99f" stroke-width="1.6"/><path d="M3 14v66c0 8 20 14 45 14s45-6 45-14V14" fill="#e8f7f3" stroke="#58a99f" stroke-width="1.6"/><path d="M3 46c0 8 20 14 45 14s45-6 45-14" fill="none" stroke="#58a99f" stroke-width="1.6"/>
  </g>
  <text x="143" y="566" text-anchor="middle" class="agent-title">Documents + Papers</text><text x="269" y="566" text-anchor="middle" class="agent-title">Project Library</text>
  <path d="M230 588V619" class="evidence"/>
  <rect x="107" y="619" width="245" height="67" rx="8" fill="#effaf7" stroke="#65aea5"/>
  <text x="230" y="645" text-anchor="middle" class="label">Document Intelligence</text><text x="230" y="664" text-anchor="middle" class="copy">parse - chunk - embed - bind provenance</text>
  <path d="M230 686V714" class="evidence"/>
  <rect x="107" y="714" width="245" height="68" rx="8" fill="#173c59"/>
  <text x="230" y="741" text-anchor="middle" class="white-title">Hybrid Retrieval</text><text x="230" y="761" text-anchor="middle" class="white-copy">dense + lexical + ranked evidence packs</text>

  <!-- Central coordinator -->
  <circle cx="800" cy="574" r="126" fill="#dceff1" stroke="#69aaa5" stroke-width="2"/>
  <circle cx="800" cy="574" r="104" fill="url(#core)" filter="url(#shadow)"/>
  <g transform="translate(726 485)">
    <path d="M74 0v17" stroke="#fff" stroke-width="4"/><circle cx="74" cy="-4" r="7" fill="#f8c85c"/>
    <rect x="17" y="18" width="114" height="75" rx="24" fill="#fff" stroke="#143650" stroke-width="3"/>
    <circle cx="52" cy="54" r="10" fill="#2f6fed"/><circle cx="96" cy="54" r="10" fill="#0f8f83"/><path d="M51 75c15 12 31 12 46 0" fill="none" stroke="#143650" stroke-width="3" stroke-linecap="round"/>
    <rect x="31" y="95" width="86" height="65" rx="17" fill="#fff" stroke="#143650" stroke-width="3"/><rect x="55" y="111" width="38" height="26" rx="6" fill="#e8f3f5" stroke="#0f8f83"/><path d="M42 158v18M106 158v18M31 112H5M117 112h26" stroke="#143650" stroke-width="6" stroke-linecap="round"/>
  </g>
  <rect x="697" y="708" width="206" height="55" rx="12" fill="#fff" stroke="#69aaa5" filter="url(#shadow)"/>
  <text x="800" y="731" text-anchor="middle" class="label">ResearchOS Coordinator</text>
  <text x="800" y="749" text-anchor="middle" class="copy">compile - plan - route - monitor - replan</text>

  <!-- Agent cards -->
  <g filter="url(#shadow)">
    <rect x="440" y="387" width="250" height="122" rx="10" fill="#f1f5ff" stroke="#84a7ea"/>
    <rect x="910" y="387" width="250" height="122" rx="10" fill="#fff8e8" stroke="#d6b35a"/>
    <rect x="1185" y="474" width="255" height="132" rx="10" fill="#fff2ee" stroke="#d9907d"/>
    <rect x="910" y="649" width="250" height="122" rx="10" fill="#f4f1ff" stroke="#a691dd"/>
    <rect x="440" y="649" width="250" height="122" rx="10" fill="#eef9f6" stroke="#69aaa2"/>
  </g>

  <!-- Agent robot icon helper instances -->
  <g transform="translate(462 407)"><rect x="0" y="12" width="54" height="38" rx="12" fill="#fff" stroke="#2f6fed" stroke-width="2"/><circle cx="17" cy="31" r="5" fill="#2f6fed"/><circle cx="37" cy="31" r="5" fill="#2f6fed"/><path d="M27 12V3M27 3l8-5" stroke="#2f6fed" stroke-width="2"/><rect x="9" y="52" width="36" height="31" rx="8" fill="#fff" stroke="#2f6fed" stroke-width="2"/></g>
  <text x="540" y="425" class="agent-title">Literature + Gap Agents</text><text x="540" y="446" class="agent-copy">search, deduplicate, synthesize</text><text x="540" y="465" class="agent-copy">map claims and unresolved gaps</text><rect x="540" y="480" width="118" height="19" rx="9" fill="#dce7ff"/><text x="599" y="493" text-anchor="middle" class="tiny">DISCOVER</text>

  <g transform="translate(932 407)"><rect x="0" y="12" width="54" height="38" rx="12" fill="#fff" stroke="#c68a14" stroke-width="2"/><circle cx="17" cy="31" r="5" fill="#c68a14"/><circle cx="37" cy="31" r="5" fill="#c68a14"/><path d="M27 12V3M27 3l8-5" stroke="#c68a14" stroke-width="2"/><rect x="9" y="52" width="36" height="31" rx="8" fill="#fff" stroke="#c68a14" stroke-width="2"/></g>
  <text x="1010" y="425" class="agent-title">Hypothesis + Lineage Agents</text><text x="1010" y="446" class="agent-copy">generate falsifiable candidates</text><text x="1010" y="465" class="agent-copy">track ancestry and rank proposals</text><rect x="1010" y="480" width="118" height="19" rx="9" fill="#f8e9bd"/><text x="1069" y="493" text-anchor="middle" class="tiny">HYPOTHESIZE</text>

  <g transform="translate(1207 497)"><rect x="0" y="12" width="54" height="38" rx="12" fill="#fff" stroke="#dd684d" stroke-width="2"/><circle cx="17" cy="31" r="5" fill="#dd684d"/><circle cx="37" cy="31" r="5" fill="#dd684d"/><path d="M27 12V3M27 3l8-5" stroke="#dd684d" stroke-width="2"/><rect x="9" y="52" width="36" height="31" rx="8" fill="#fff" stroke="#dd684d" stroke-width="2"/></g>
  <text x="1285" y="515" class="agent-title">Novelty + Feasibility Agents</text><text x="1285" y="536" class="agent-copy">compare prior art and constraints</text><text x="1285" y="555" class="agent-copy">check data, compute, risk, ethics</text><rect x="1285" y="572" width="115" height="19" rx="9" fill="#f7dcd4"/><text x="1342" y="585" text-anchor="middle" class="tiny">EVALUATE</text>

  <g transform="translate(932 669)"><rect x="0" y="12" width="54" height="38" rx="12" fill="#fff" stroke="#8066c2" stroke-width="2"/><circle cx="17" cy="31" r="5" fill="#8066c2"/><circle cx="37" cy="31" r="5" fill="#8066c2"/><path d="M27 12V3M27 3l8-5" stroke="#8066c2" stroke-width="2"/><rect x="9" y="52" width="36" height="31" rx="8" fill="#fff" stroke="#8066c2" stroke-width="2"/></g>
  <text x="1010" y="687" class="agent-title">Experiment + Statistics Agents</text><text x="1010" y="708" class="agent-copy">execute code and capture provenance</text><text x="1010" y="727" class="agent-copy">review methods, effects, uncertainty</text><rect x="1010" y="742" width="118" height="19" rx="9" fill="#e6def8"/><text x="1069" y="755" text-anchor="middle" class="tiny">TEST</text>

  <g transform="translate(462 669)"><rect x="0" y="12" width="54" height="38" rx="12" fill="#fff" stroke="#0f8f83" stroke-width="2"/><circle cx="17" cy="31" r="5" fill="#0f8f83"/><circle cx="37" cy="31" r="5" fill="#0f8f83"/><path d="M27 12V3M27 3l8-5" stroke="#0f8f83" stroke-width="2"/><rect x="9" y="52" width="36" height="31" rx="8" fill="#fff" stroke="#0f8f83" stroke-width="2"/></g>
  <text x="540" y="687" class="agent-title">Critic + Writing Agents</text><text x="540" y="708" class="agent-copy">challenge assumptions and revise</text><text x="540" y="727" class="agent-copy">compose evidence-linked sections</text><rect x="540" y="742" width="118" height="19" rx="9" fill="#d9f0eb"/><text x="599" y="755" text-anchor="middle" class="tiny">SYNTHESIZE</text>

  <!-- Routing and feedback -->
  <path d="M718 500C680 464 666 451 690 451" class="link"/><path d="M882 500C920 464 928 451 910 451" class="link"/>
  <path d="M902 574H1185" class="link"/><path d="M882 650C920 686 928 710 910 710" class="link"/><path d="M718 650C680 686 666 710 690 710" class="link"/>
  <path d="M377 748H440" class="evidence"/><text x="405" y="739" text-anchor="middle" class="tiny">evidence</text>
  <path d="M1285 606C1260 797 1064 827 800 803C553 781 441 812 440 725" class="feedback"/>
  <text x="852" y="824" text-anchor="middle" class="tiny" fill="#dd684d">verification failures return claims for retrieval, revision, or replanning</text>

  <!-- Delivery -->
  <rect x="1185" y="632" width="255" height="150" rx="10" fill="#fff" stroke="#64aaa2" filter="url(#shadow)"/>
  <circle cx="1212" cy="660" r="15" fill="#0f8f83"/><path d="M1205 660l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1238" y="665" class="section">Verify + Deliver</text>
  <path d="M1212 693h25l9 9 18-25" fill="none" stroke="#0f8f83" stroke-width="3"/>
  <text x="1276" y="697" class="agent-title">Claim and citation validation</text>
  <path d="M1212 723h31M1212 738h55" stroke="#8094a3" stroke-width="5" stroke-linecap="round"/>
  <text x="1276" y="733" class="agent-title">Draft + references + export</text>
  <text x="1313" y="764" text-anchor="middle" class="copy">IEEE - APA 7 - Harvard - MLA 9</text>
  <path d="M1440 707H1483V263" class="flow"/>

  <!-- Persistence plane -->
  <rect x="55" y="895" width="1490" height="115" rx="14" fill="#f3f6f8" stroke="#bdccd7"/>
  <text x="79" y="921" class="eyebrow">PERSISTENT RESEARCH MEMORY + GOVERNANCE</text>
  <g transform="translate(87 942)"><ellipse cx="44" cy="10" rx="42" ry="10" fill="#fff" stroke="#7891a3"/><path d="M2 10v36c0 6 19 10 42 10s42-4 42-10V10" fill="#fff" stroke="#7891a3"/><text x="106" y="24" class="label">PostgreSQL State</text><text x="106" y="42" class="copy">projects, runs, conversations</text></g>
  <g transform="translate(393 940)"><rect x="0" y="0" width="72" height="55" rx="7" fill="#fff" stroke="#7891a3"/><circle cx="18" cy="17" r="5" fill="#2f6fed"/><circle cx="36" cy="17" r="5" fill="#0f8f83"/><circle cx="54" cy="17" r="5" fill="#c68a14"/><path d="M14 34h44M14 44h30" stroke="#91a3b1" stroke-width="4" stroke-linecap="round"/><text x="92" y="23" class="label">Evidence + Vector Index</text><text x="92" y="41" class="copy">chunks, embeddings, provenance</text></g>
  <g transform="translate(768 940)"><path d="M0 8h68v49H0z" fill="#fff" stroke="#7891a3"/><path d="M12 0h33l10 8H12z" fill="#e8f3f5" stroke="#7891a3"/><text x="88" y="23" class="label">Artifact Store</text><text x="88" y="41" class="copy">sources, drafts, results, exports</text></g>
  <g transform="translate(1074 940)"><path d="M11 13l25-12 25 12v18c0 16-10 24-25 31-15-7-25-15-25-31z" fill="#fff" stroke="#0f8f83" stroke-width="2"/><path d="M24 30l8 8 16-19" fill="none" stroke="#0f8f83" stroke-width="3"/><text x="82" y="23" class="label">Security + Audit</text><text x="82" y="41" class="copy">tenant scope, approvals, usage</text></g>
  <path d="M800 803V895" class="link"/><path d="M230 809V895" class="link"/><path d="M1313 782V895" class="link"/>

  <text x="800" y="1035" text-anchor="middle" class="tiny">Solid arrows: workflow and delivery   -   Teal arrows: evidence flow   -   Coral dashed arrow: quality-control feedback   -   Gray dashed lines: routing and persistence</text>
</svg>

