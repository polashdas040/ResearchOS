  <text x="236" y="518" class="node-small">EVIDENCE AND WRITING PIPELINE</text>
  <g filter="url(#shadow)"><rect x="235" y="536" width="235" height="95" class="node-teal"/></g>
  <text x="259" y="568" class="node-title">Document Intelligence</text><text x="259" y="593" class="node-copy">PDF parsing, elements, tables</text><text x="259" y="613" class="node-copy">Figures, datasets, provenance</text>
  <g filter="url(#shadow)"><rect x="515" y="536" width="235" height="95" class="node-teal"/></g>
