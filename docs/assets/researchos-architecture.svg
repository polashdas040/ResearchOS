  <g filter="url(#shadow)"><rect x="1305" y="309" width="220" height="122" class="node"/></g>
  <text x="1329" y="342" class="node-title">Chat Streaming</text><text x="1329" y="368" class="node-copy">History-aware model context</text><text x="1329" y="389" class="node-copy">Citation-style instructions</text><text x="1329" y="410" class="node-copy">SSE lifecycle and usage</text>
  <g filter="url(#shadow)"><rect x="1565" y="309" width="165" height="122" class="node"/></g>
  <text x="1589" y="342" class="node-title">Jobs API</text><text x="1589" y="368" class="node-copy">Durable jobs</text><text x="1589" y="389" class="node-copy">Retry / cancel</text><text x="1589" y="410" class="node-copy">Run progress</text>
