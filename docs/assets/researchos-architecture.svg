  <g filter="url(#shadow)"><rect x="495" y="128" width="315" height="112" class="node"/></g>
  <text x="519" y="161" class="node-title">Next.js 15 Workspace</text><text x="519" y="187" class="node-copy">Projects, navigation, responsive shell</text><text x="519" y="208" class="node-copy">React 19 + TypeScript</text>
  <g filter="url(#shadow)"><rect x="865" y="128" width="265" height="112" class="node"/></g>
  <text x="889" y="161" class="node-title">Academic Editor</text><text x="889" y="187" class="node-copy">Sections, tables, images, equations</text><text x="889" y="208" class="node-copy">DOCX / PDF export</text>
  <g filter="url(#shadow)"><rect x="1185" y="128" width="250" height="112" class="node"/></g>
  <text x="1209" y="161" class="node-title">AI Research Chat</text><text x="1209" y="187" class="node-copy">Streaming answers and agents</text><text x="1209" y="208" class="node-copy">Files, citations, run status</text>
  <g filter="url(#shadow)"><rect x="1490" y="128" width="240" height="112" class="node"/></g>
  <text x="1514" y="161" class="node-title">Library &amp; Papers</text><text x="1514" y="187" class="node-copy">Imported PDFs and summaries</text><text x="1514" y="208" class="node-copy">Search and source preview</text>
