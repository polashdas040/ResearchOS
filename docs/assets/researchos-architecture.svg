  <rect x="32" y="282" width="170" height="178" fill="#356f99" rx="8"/>
  <text x="58" y="317" class="band-title">APPLICATION</text><text x="58" y="341" class="band-title">PLANE</text>
  <text x="58" y="380" class="band-copy">FastAPI service</text><text x="58" y="399" class="band-copy">Tenant boundaries</text><text x="58" y="418" class="band-copy">REST + SSE</text>

