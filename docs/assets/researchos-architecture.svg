<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ResearchOS Multi-Agent Research Architecture</title>
  <desc id="desc">Professional layered architecture showing researcher inputs, orchestration, specialized research agents, evidence retrieval, verification, outputs, and persistent infrastructure.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#17324d"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16877c"/></marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d5644a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/></filter>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17324d;letter-spacing:0}.title{font-size:30px;font-weight:700}.subtitle{font-size:14px;fill:#617487}.band-label{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#60788c}.heading{font-size:17px;font-weight:700}.label{font-size:14px;font-weight:700}.body{font-size:12px;fill:#53697c}.small{font-size:11px;fill:#617487}.white{fill:#fff}.white-body{font-size:12px;fill:#e8f4f2}.panel{fill:#fff;stroke:#b9c9d5;stroke-width:1.3}.agent{fill:#fff;stroke:#9db1c0;stroke-width:1.2}.flow{fill:none;stroke:#17324d;stroke-width:2;marker-end:url(#arrow-navy)}.evidence{fill:none;stroke:#16877c;stroke-width:2.2;marker-end:url(#arrow-teal)}.feedback{fill:none;stroke:#d5644a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow-coral)}.route{fill:none;stroke:#7d93a4;stroke-width:1.5;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text x="800" y="42" text-anchor="middle" class="title">ResearchOS Multi-Agent Research Architecture</text>
  <text x="800" y="67" text-anchor="middle" class="subtitle">Human-guided, evidence-grounded research from source ingestion to verified academic output</text>

  <rect x="65" y="100" width="300" height="112" rx="8" class="panel" filter="url(#shadow)"/>
  <circle cx="110" cy="140" r="18" fill="#17324d"/><path d="M80 190c2-27 14-41 30-41s28 14 30 41" fill="#17324d"/>
  <rect x="160" y="124" width="178" height="62" rx="5" fill="#f4f7f9" stroke="#9eb0bd"/><path d="M175 141h110M175 155h139M175 169h85" stroke="#8da1b0" stroke-width="5" stroke-linecap="round"/>
  <text x="215" y="201" text-anchor="middle" class="label">Researcher and Project Workspace</text>
  <rect x="1235" y="100" width="300" height="112" rx="8" class="panel" filter="url(#shadow)"/>
  <path d="M1272 165c0-14 11-25 25-26 5-17 21-29 40-29 22 0 40 17 42 38 14 1 25 12 25 26 0 15-12 27-27 27h-78c-15 0-27-12-27-27z" fill="#f4f7f9" stroke="#7990a2" stroke-width="1.7"/>
  <circle cx="1320" cy="159" r="19" fill="#edf3ff" stroke="#7297df"/><text x="1320" y="164" text-anchor="middle" class="small">LLM</text><circle cx="1362" cy="159" r="19" fill="#edf8f5" stroke="#65a89f"/><text x="1362" y="164" text-anchor="middle" class="small">API</text>
  <text x="1460" y="143" text-anchor="middle" class="label">External Services</text><text x="1460" y="164" text-anchor="middle" class="body">Model providers</text><text x="1460" y="183" text-anchor="middle" class="body">Scholarly search and tools</text>

  <rect x="65" y="245" width="1470" height="625" rx="12" fill="#f9fbfc" stroke="#9fb5c4" stroke-width="1.5"/><text x="90" y="274" class="band-label">RESEARCHOS RUNTIME</text>
  <path d="M215 212V305" class="flow"/><text x="229" y="237" class="small">research goal, files, constraints</text><path d="M1385 212V305" class="flow"/><text x="1399" y="237" class="small">models and tools</text>

  <rect x="90" y="305" width="1420" height="120" rx="8" fill="#eef4f7" stroke="#c2d0d9"/><text x="110" y="330" class="band-label">1 · CONTEXT AND ORCHESTRATION</text>
  <rect x="120" y="345" width="260" height="60" rx="6" class="panel"/><circle cx="148" cy="375" r="15" fill="#2f6fed"/><path d="M140 375h16M148 367v16" stroke="#fff" stroke-width="2"/><text x="174" y="369" class="label">Context Compiler</text><text x="174" y="389" class="body">Draft, prompt, sources, and history</text>
  <rect x="475" y="345" width="260" height="60" rx="6" class="panel"/><circle cx="503" cy="375" r="15" fill="#4d78a3"/><path d="M495 370h16M495 376h12M495 382h8" stroke="#fff" stroke-width="2"/><text x="529" y="369" class="label">Dynamic Planner</text><text x="529" y="389" class="body">Decompose, prioritize, and schedule</text>
  <rect x="830" y="337" width="300" height="76" rx="8" fill="#176d80" stroke="#0f5c6d" filter="url(#shadow)"/><circle cx="864" cy="375" r="19" fill="#fff"/><circle cx="857" cy="373" r="3.5" fill="#176d80"/><circle cx="871" cy="373" r="3.5" fill="#176d80"/><path d="M857 382c5 4 10 4 15 0M864 356v-7" fill="none" stroke="#176d80" stroke-width="2"/><text x="896" y="369" class="label white">Agent Coordinator</text><text x="896" y="389" class="white-body">Route, monitor, retry, and replan</text>
  <rect x="1225" y="345" width="255" height="60" rx="6" class="panel"/><circle cx="1253" cy="375" r="15" fill="#16877c"/><path d="M1245 375l6 6 11-14" fill="none" stroke="#fff" stroke-width="2.5"/><text x="1279" y="369" class="label">Policy and Guardrails</text><text x="1279" y="389" class="body">Scope, budgets, and approvals</text>
  <path d="M380 375H475" class="flow"/><path d="M735 375H830" class="flow"/><path d="M1130 375H1225" class="flow"/>

  <rect x="90" y="445" width="1420" height="190" rx="8" fill="#f5f8fa" stroke="#c2d0d9"/><text x="110" y="470" class="band-label">2 · SPECIALIZED RESEARCH AGENTS</text>
  <g filter="url(#shadow)"><rect x="120" y="490" width="244" height="116" rx="7" class="agent"/><rect x="398" y="490" width="244" height="116" rx="7" class="agent"/><rect x="676" y="490" width="244" height="116" rx="7" class="agent"/><rect x="954" y="490" width="244" height="116" rx="7" class="agent"/><rect x="1232" y="490" width="244" height="116" rx="7" class="agent"/></g>
  <rect x="120" y="490" width="244" height="7" rx="4" fill="#2f6fed"/><circle cx="150" cy="526" r="16" fill="#eaf1ff"/><path d="M142 528l6-6 5 5 8-9" fill="none" stroke="#2f6fed" stroke-width="2"/><text x="178" y="523" class="label">Literature Agent</text><text x="140" y="552" class="body">Discover and deduplicate studies</text><text x="140" y="572" class="body">Build evidence-backed syntheses</text><text x="140" y="592" class="body">Map the research landscape</text>
  <rect x="398" y="490" width="244" height="7" rx="4" fill="#4d78a3"/><circle cx="428" cy="526" r="16" fill="#edf3f7"/><path d="M420 531l8-14 8 14M423 526h10" fill="none" stroke="#4d78a3" stroke-width="2"/><text x="456" y="523" class="label">Gap and Hypothesis</text><text x="418" y="552" class="body">Identify unresolved questions</text><text x="418" y="572" class="body">Generate falsifiable hypotheses</text><text x="418" y="592" class="body">Track hypothesis lineage</text>
  <rect x="676" y="490" width="244" height="7" rx="4" fill="#c9912c"/><circle cx="706" cy="526" r="16" fill="#fff7e7"/><path d="M699 525l5 5 10-12" fill="none" stroke="#c9912c" stroke-width="2"/><text x="734" y="523" class="label">Novelty and Feasibility</text><text x="696" y="552" class="body">Compare prior art and contribution</text><text x="696" y="572" class="body">Assess data, compute, and risk</text><text x="696" y="592" class="body">Rank viable research directions</text>
  <rect x="954" y="490" width="244" height="7" rx="4" fill="#8066c2"/><circle cx="984" cy="526" r="16" fill="#f1edfb"/><path d="M976 532h16M979 527v-8h10v8" fill="none" stroke="#8066c2" stroke-width="2"/><text x="1012" y="523" class="label">Experiment and Statistics</text><text x="974" y="552" class="body">Design and execute analyses</text><text x="974" y="572" class="body">Review methods and uncertainty</text><text x="974" y="592" class="body">Capture reproducible provenance</text>
  <rect x="1232" y="490" width="244" height="7" rx="4" fill="#16877c"/><circle cx="1262" cy="526" r="16" fill="#e8f6f3"/><path d="M1254 522h16M1254 528h12M1254 534h9" fill="none" stroke="#16877c" stroke-width="2"/><text x="1290" y="523" class="label">Critic and Writing</text><text x="1252" y="552" class="body">Challenge claims and assumptions</text><text x="1252" y="572" class="body">Revise evidence-linked content</text><text x="1252" y="592" class="body">Compose academic sections</text>
  <path d="M980 413V453H242V490M520 453V490M798 453V490M1076 453V490M1354 453V490" class="route"/>

  <rect x="90" y="655" width="1420" height="180" rx="8" fill="#eef7f5" stroke="#b4d0cb"/><text x="110" y="680" class="band-label">3 · SHARED EVIDENCE, VERIFICATION, AND DELIVERY</text>
  <rect x="120" y="700" width="300" height="105" rx="7" class="panel"/><text x="145" y="730" class="label">Hybrid Retrieval</text><text x="145" y="753" class="body">Dense and lexical search with reranking</text><text x="145" y="774" class="body">Page-level provenance and evidence packs</text><circle cx="390" cy="730" r="16" fill="#16877c"/><path d="M383 731l5 5 10-12" fill="none" stroke="#fff" stroke-width="2.5"/>
  <rect x="480" y="700" width="300" height="105" rx="7" fill="#176d80" stroke="#0f5c6d" filter="url(#shadow)"/><text x="505" y="730" class="label white">Shared Research State</text><text x="505" y="753" class="white-body">Claims, sources, citations, and artifacts</text><text x="505" y="774" class="white-body">Agent outputs with complete provenance</text>
  <rect x="840" y="700" width="300" height="105" rx="7" class="panel"/><text x="865" y="730" class="label">Verification Layer</text><text x="865" y="753" class="body">Claim-to-evidence and citation checks</text><text x="865" y="774" class="body">Contradictions, quality, and completeness</text><circle cx="1110" cy="730" r="16" fill="#d5644a"/><path d="M1102 730l6 6 11-14" fill="none" stroke="#fff" stroke-width="2.5"/>
  <rect x="1200" y="700" width="276" height="105" rx="7" class="panel"/><text x="1225" y="730" class="label">Research Outputs</text><text x="1225" y="753" class="body">Draft, chat, and cited references</text><text x="1225" y="774" class="body">Word and PDF export</text>
  <path d="M420 752H480" class="evidence"/><path d="M780 752H840" class="evidence"/><path d="M1140 752H1200" class="flow"/><path d="M1354 606V680H630V700" class="evidence"/>
  <path d="M990 700V665H270V700" class="feedback"/>

  <rect x="65" y="900" width="1470" height="72" rx="9" fill="#f2f5f7" stroke="#b9c9d5"/><text x="90" y="927" class="band-label">PERSISTENT PLATFORM</text>
  <text x="90" y="953" class="label">PostgreSQL</text><text x="185" y="953" class="body">projects and runs</text><line x1="330" y1="922" x2="330" y2="956" stroke="#c1ced7"/>
  <text x="365" y="953" class="label">Vector Index</text><text x="465" y="953" class="body">chunks and embeddings</text><line x1="650" y1="922" x2="650" y2="956" stroke="#c1ced7"/>
  <text x="685" y="953" class="label">Artifact Store</text><text x="785" y="953" class="body">sources, results, and exports</text><line x1="1010" y1="922" x2="1010" y2="956" stroke="#c1ced7"/>
  <text x="1045" y="953" class="label">Security and Audit</text><text x="1180" y="953" class="body">tenant scope, approvals, and usage</text>
  <path d="M630 805V900M990 805V900M1338 805V900" class="route"/>
  <text x="800" y="992" text-anchor="middle" class="small">Navy: workflow · Teal: evidence flow · Coral dashed: quality-control feedback · Gray dashed: coordination and persistence</text>
</svg>

