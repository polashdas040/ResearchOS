  <text x="529" y="342" class="node-title">Identity &amp; Tenancy</text><text x="529" y="368" class="node-copy">Registration, login, refresh</text><text x="529" y="389" class="node-copy">Organizations and authorization</text><text x="529" y="410" class="node-copy">Bearer-token security</text>
  <g filter="url(#shadow)"><rect x="765" y="309" width="230" height="122" class="node"/></g>
