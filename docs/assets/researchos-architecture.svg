  <text x="259" y="342" class="node-title">API Gateway</text><text x="259" y="368" class="node-copy">FastAPI routers + validation</text><text x="259" y="389" class="node-copy">CORS, readiness, error mapping</text><text x="259" y="410" class="node-copy">OpenAPI at /docs</text>
