<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125" role="img" aria-labelledby="title desc">
  <title id="title">ResearchOS Evidence-Grounded Multi-Agent Architecture</title>
  <desc id="desc">Vector architecture showing a researcher, external AI services, evidence ingestion, a central ResearchOS orchestrator, five specialist agents, verification, outputs, and persistent infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#eef5f7"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#214d6b"/><stop offset="1" stop-color="#102f48"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21a99b"/><stop offset="1" stop-color="#0d716a"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="0.55" stop-color="#e8f0f4"/><stop offset="1" stop-color="#c6d5df"/></linearGradient>
    <linearGradient id="blueglass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6f1ff"/><stop offset="1" stop-color="#b8d4f3"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#61d4c8" stop-opacity="0.55"/><stop offset="1" stop-color="#61d4c8" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#17344d" flood-opacity="0.16"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="11"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#214d6b"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#158c83"/></marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d56950"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#16354e}.title{font-size:32px;font-weight:700}.subtitle{font-size:15px;fill:#5c7183}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#637d91}.section{font-size:19px;font-weight:700}.label{font-size:15px;font-weight:700}.body{font-size:12px;fill:#597083}.small{font-size:11px;fill:#64798a}.white{fill:#fff}.whitebody{font-size:12px;fill:#dff3f0}.panel{fill:#fff;stroke:#b6c8d4;stroke-width:1.4}.flow{fill:none;stroke:#214d6b;stroke-width:2.2;marker-end:url(#arrow)}.evidence{fill:none;stroke:#158c83;stroke-width:2.4;marker-end:url(#arrow-teal)}.route{fill:none;stroke:#7891a4;stroke-width:1.7;stroke-dasharray:5 5}.feedback{fill:none;stroke:#d56950;stroke-width:2.1;stroke-dasharray:7 6;marker-end:url(#arrow-coral)}
    </style>
  </defs>

  <rect width="1800" height="1125" fill="#fff"/>
  <text x="900" y="43" text-anchor="middle" class="title">ResearchOS Evidence-Grounded Multi-Agent Architecture</text>
  <text x="900" y="70" text-anchor="middle" class="subtitle">Human-guided research coordination with traceable evidence, specialized agents, and claim-level verification</text>

  <!-- Researcher -->
  <g filter="url(#shadow)">
    <rect x="70" y="105" width="360" height="150" rx="12" fill="url(#bg)" stroke="#a9bfcd"/>
    <path d="M95 225h132l-13 17H108z" fill="#b7c8d3"/><rect x="100" y="126" width="126" height="91" rx="6" fill="#173d59"/><rect x="108" y="134" width="110" height="73" rx="3" fill="url(#blueglass)"/>
    <path d="M122 153h70M122 167h82M122 181h55" stroke="#7193ae" stroke-width="6" stroke-linecap="round"/>
    <circle cx="281" cy="151" r="24" fill="#c58d68"/><path d="M253 149c2-27 13-38 29-38 17 0 29 13 30 39-10-8-21-12-31-12-9 0-18 4-28 11z" fill="#18364d"/>
    <path d="M241 228c3-42 18-64 40-64 24 0 41 23 44 64" fill="#216d80"/><path d="M281 175v34M256 195l25 14 26-14" fill="none" stroke="#e7f3f4" stroke-width="3"/>
    <text x="250" y="243" text-anchor="middle" class="label">Researcher and Project Workspace</text>
  </g>

  <!-- External services -->
  <g filter="url(#shadow)">
    <rect x="1370" y="105" width="360" height="150" rx="12" fill="url(#bg)" stroke="#a9bfcd"/>
    <path d="M1400 199c0-17 13-31 30-32 6-22 25-36 48-36 28 0 50 21 52 47 18 1 32 16 32 34 0 18-15 33-34 33h-95c-18 0-33-15-33-33z" fill="url(#metal)" stroke="#71899c" stroke-width="2"/>
    <circle cx="1460" cy="193" r="26" fill="#e7f0ff" stroke="#6e96d9"/><path d="M1449 193h22M1460 182v22" stroke="#507dbd" stroke-width="2"/><text x="1460" y="230" text-anchor="middle" class="small">LLM</text>
    <circle cx="1510" cy="193" r="26" fill="#e4f6f2" stroke="#5ba79e"/><path d="M1497 193h26M1510 180v26" stroke="#16877c" stroke-width="2"/><text x="1510" y="230" text-anchor="middle" class="small">TOOLS</text>
    <text x="1633" y="155" text-anchor="middle" class="label">External Services</text><text x="1633" y="180" text-anchor="middle" class="body">Model providers</text><text x="1633" y="201" text-anchor="middle" class="body">Scholarly search</text><text x="1633" y="222" text-anchor="middle" class="body">Code and data tools</text>
  </g>

  <!-- Runtime -->
  <rect x="70" y="300" width="1660" height="680" rx="18" fill="url(#bg)" stroke="#91adbf" stroke-width="1.7"/>
  <text x="98" y="332" class="eyebrow">RESEARCHOS AGENT RUNTIME</text>
  <path d="M250 255V300" class="flow"/><text x="267" y="283" class="small">research question, sources, constraints</text>
  <path d="M1550 255V300" class="flow"/><text x="1567" y="283" class="small">models, search, and tools</text>

  <!-- Evidence platform -->
  <g filter="url(#shadow)">
    <rect x="105" y="370" width="305" height="440" rx="13" class="panel"/>
    <rect x="105" y="370" width="305" height="48" rx="13" fill="#e8f4f7"/><path d="M105 405h305" stroke="#c1d3dc"/>
    <circle cx="135" cy="394" r="16" fill="#2f70c9"/><text x="135" y="399" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="160" y="400" class="section">Evidence Foundation</text>
    <g transform="translate(136 452)"><path d="M0 0h70l25 25v100H0z" fill="#edf4ff" stroke="#6d94d7" stroke-width="2"/><path d="M70 0v25h25" fill="none" stroke="#6d94d7" stroke-width="2"/><path d="M17 52h60M17 70h60M17 88h43" stroke="#6d94d7" stroke-width="6" stroke-linecap="round"/></g>
    <g transform="translate(270 460)"><ellipse cx="50" cy="15" rx="48" ry="15" fill="#e6f7f3" stroke="#54a79d" stroke-width="2"/><path d="M2 15v88c0 9 22 16 48 16s48-7 48-16V15" fill="#e6f7f3" stroke="#54a79d" stroke-width="2"/><path d="M2 55c0 9 22 16 48 16s48-7 48-16M2 83c0 9 22 16 48 16s48-7 48-16" fill="none" stroke="#54a79d" stroke-width="2"/></g>
    <text x="183" y="600" text-anchor="middle" class="label">Imported Sources</text><text x="320" y="600" text-anchor="middle" class="label">Project Library</text>
    <rect x="130" y="628" width="255" height="67" rx="8" fill="#f4f8fa" stroke="#adc1ce"/><text x="257" y="654" text-anchor="middle" class="label">Document Intelligence</text><text x="257" y="675" text-anchor="middle" class="body">parse · chunk · embed · provenance</text>
    <path d="M257 695V720" class="evidence"/>
    <rect x="130" y="720" width="255" height="66" rx="8" fill="url(#navy)"/><text x="257" y="747" text-anchor="middle" class="label white">Hybrid Retrieval</text><text x="257" y="768" text-anchor="middle" class="whitebody">dense + lexical + reranked evidence</text>
  </g>

  <!-- Central orchestration glow and platform -->
  <ellipse cx="900" cy="630" rx="265" ry="160" fill="url(#glow)"/>
  <path d="M720 720l180-90 180 90-180 90z" fill="#d9e6eb" stroke="#8aa4b5" stroke-width="2"/>
  <path d="M720 720v35l180 90v-35z" fill="#b9cbd5" stroke="#8aa4b5"/><path d="M1080 720v35l-180 90v-35z" fill="#a2bbc8" stroke="#8aa4b5"/>

  <!-- Coordinator -->
  <g filter="url(#shadow)">
    <circle cx="900" cy="605" r="125" fill="#d7eeee" stroke="#68aaa3" stroke-width="2"/>
    <circle cx="900" cy="605" r="104" fill="url(#teal)"/>
    <path d="M900 499v-22" stroke="#fff" stroke-width="5"/><circle cx="900" cy="472" r="9" fill="#f3c659"/>
    <rect x="835" y="518" width="130" height="86" rx="28" fill="url(#metal)" stroke="#143a52" stroke-width="3"/>
    <circle cx="874" cy="560" r="11" fill="#2e70d1"/><circle cx="926" cy="560" r="11" fill="#159287"/><path d="M872 582c18 14 38 14 56 0" fill="none" stroke="#143a52" stroke-width="4" stroke-linecap="round"/>
    <rect x="850" y="610" width="100" height="79" rx="20" fill="url(#metal)" stroke="#143a52" stroke-width="3"/><rect x="873" y="630" width="54" height="34" rx="7" fill="#dff5f1" stroke="#159287"/>
    <path d="M850 630h-31M950 630h31M868 689v25M932 689v25" stroke="#143a52" stroke-width="7" stroke-linecap="round"/>
    <rect x="782" y="752" width="236" height="64" rx="10" fill="#fff" stroke="#6baaa5"/>
    <text x="900" y="779" text-anchor="middle" class="label">ResearchOS Orchestrator</text><text x="900" y="801" text-anchor="middle" class="body">compile · plan · route · monitor · replan</text>
  </g>

  <!-- Agent cards -->
  <g filter="url(#shadow)">
    <rect x="470" y="365" width="285" height="130" rx="10" class="panel"/><rect x="470" y="365" width="285" height="7" rx="4" fill="#2f70c9"/>
    <rect x="758" y="345" width="285" height="130" rx="10" class="panel"/><rect x="758" y="345" width="285" height="7" rx="4" fill="#517da5"/>
    <rect x="1046" y="365" width="285" height="130" rx="10" class="panel"/><rect x="1046" y="365" width="285" height="7" rx="4" fill="#c99431"/>
    <rect x="1046" y="735" width="285" height="130" rx="10" class="panel"/><rect x="1046" y="735" width="285" height="7" rx="4" fill="#7963bc"/>
    <rect x="470" y="735" width="285" height="130" rx="10" class="panel"/><rect x="470" y="735" width="285" height="7" rx="4" fill="#16877c"/>
  </g>
  <!-- mini robots -->
  <g transform="translate(492 390)"><rect width="58" height="43" rx="14" fill="url(#metal)" stroke="#2f70c9" stroke-width="2"/><circle cx="19" cy="22" r="5" fill="#2f70c9"/><circle cx="39" cy="22" r="5" fill="#2f70c9"/><path d="M29 0v-10l8-5" stroke="#2f70c9" stroke-width="2"/><rect x="10" y="47" width="38" height="31" rx="8" fill="#edf4ff" stroke="#2f70c9" stroke-width="2"/></g>
  <text x="574" y="405" class="label">Literature Agent</text><text x="574" y="428" class="body">Discover and deduplicate studies</text><text x="574" y="449" class="body">Synthesize evidence and prior work</text><text x="574" y="470" class="body">Map the research landscape</text>
  <g transform="translate(780 370)"><rect width="58" height="43" rx="14" fill="url(#metal)" stroke="#517da5" stroke-width="2"/><circle cx="19" cy="22" r="5" fill="#517da5"/><circle cx="39" cy="22" r="5" fill="#517da5"/><path d="M29 0v-10l8-5" stroke="#517da5" stroke-width="2"/><rect x="10" y="47" width="38" height="31" rx="8" fill="#eef3f7" stroke="#517da5" stroke-width="2"/></g>
  <text x="862" y="385" class="label">Gap and Hypothesis Agent</text><text x="862" y="408" class="body">Detect unresolved research questions</text><text x="862" y="429" class="body">Generate falsifiable hypotheses</text><text x="862" y="450" class="body">Track hypothesis lineage</text>
  <g transform="translate(1068 390)"><rect width="58" height="43" rx="14" fill="url(#metal)" stroke="#c99431" stroke-width="2"/><circle cx="19" cy="22" r="5" fill="#c99431"/><circle cx="39" cy="22" r="5" fill="#c99431"/><path d="M29 0v-10l8-5" stroke="#c99431" stroke-width="2"/><rect x="10" y="47" width="38" height="31" rx="8" fill="#fff7e7" stroke="#c99431" stroke-width="2"/></g>
  <text x="1150" y="405" class="label">Novelty and Feasibility</text><text x="1150" y="428" class="body">Compare contribution with prior art</text><text x="1150" y="449" class="body">Assess data, compute, risk, and ethics</text><text x="1150" y="470" class="body">Rank viable research directions</text>
  <g transform="translate(1068 760)"><rect width="58" height="43" rx="14" fill="url(#metal)" stroke="#7963bc" stroke-width="2"/><circle cx="19" cy="22" r="5" fill="#7963bc"/><circle cx="39" cy="22" r="5" fill="#7963bc"/><path d="M29 0v-10l8-5" stroke="#7963bc" stroke-width="2"/><rect x="10" y="47" width="38" height="31" rx="8" fill="#f3effb" stroke="#7963bc" stroke-width="2"/></g>
  <text x="1150" y="775" class="label">Experiment and Statistics</text><text x="1150" y="798" class="body">Design and execute analyses</text><text x="1150" y="819" class="body">Review methods and uncertainty</text><text x="1150" y="840" class="body">Capture reproducible provenance</text>
  <g transform="translate(492 760)"><rect width="58" height="43" rx="14" fill="url(#metal)" stroke="#16877c" stroke-width="2"/><circle cx="19" cy="22" r="5" fill="#16877c"/><circle cx="39" cy="22" r="5" fill="#16877c"/><path d="M29 0v-10l8-5" stroke="#16877c" stroke-width="2"/><rect x="10" y="47" width="38" height="31" rx="8" fill="#e7f6f3" stroke="#16877c" stroke-width="2"/></g>
  <text x="574" y="775" class="label">Critic and Writing Agent</text><text x="574" y="798" class="body">Challenge claims and assumptions</text><text x="574" y="819" class="body">Revise evidence-linked content</text><text x="574" y="840" class="body">Compose academic sections</text>

  <!-- Routed collaboration -->
  <path d="M755 430C810 470 820 485 840 510M900 475V500M1046 430C990 470 980 485 960 510M1046 800C990 755 980 730 960 700M755 800C810 755 820 730 840 700" class="route"/>
  <path d="M410 753H720" class="evidence"/><text x="565" y="743" text-anchor="middle" class="small">retrieved evidence packs</text>

  <!-- Verification and output -->
  <g filter="url(#shadow)">
    <rect x="1385" y="370" width="310" height="440" rx="13" class="panel"/>
    <rect x="1385" y="370" width="310" height="48" rx="13" fill="#e8f4f1"/><path d="M1385 405h310" stroke="#c1d3dc"/>
    <circle cx="1415" cy="394" r="16" fill="#16877c"/><text x="1415" y="399" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="1440" y="400" class="section">Verify and Deliver</text>
    <path d="M1490 455l52-24 52 24v38c0 40-22 65-52 82-30-17-52-42-52-82z" fill="#e8f7f3" stroke="#16877c" stroke-width="3"/><path d="M1517 493l18 18 34-43" fill="none" stroke="#16877c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1542" y="611" text-anchor="middle" class="label">Claim and Citation Validation</text><text x="1542" y="634" text-anchor="middle" class="body">support · contradiction · completeness</text>
    <rect x="1410" y="663" width="260" height="115" rx="8" fill="#f4f8fa" stroke="#adc1ce"/>
    <path d="M1436 691h42v56h-42z" fill="#fff" stroke="#6e8da2"/><path d="M1445 705h24M1445 718h24M1445 731h16" stroke="#7893a5" stroke-width="3"/>
    <text x="1495" y="695" class="label">Research Outputs</text><text x="1495" y="718" class="body">Draft and research chat</text><text x="1495" y="739" class="body">Verified references</text><text x="1495" y="760" class="body">Word and PDF export</text>
  </g>
  <path d="M1080 605H1385" class="flow"/><text x="1232" y="594" text-anchor="middle" class="small">claims, citations, and generated content</text>
  <path d="M1542 810V890H257V786" class="feedback"/><text x="900" y="884" text-anchor="middle" class="small">verification failures return claims for retrieval, revision, or replanning</text>

  <!-- Persistence -->
  <rect x="70" y="1010" width="1660" height="80" rx="11" fill="#eef3f6" stroke="#a9bdca"/>
  <text x="98" y="1038" class="eyebrow">PERSISTENT RESEARCH PLATFORM</text>
  <g transform="translate(100 1050)"><ellipse cx="35" cy="8" rx="34" ry="8" fill="#fff" stroke="#71899b"/><path d="M1 8v25c0 5 15 8 34 8s34-3 34-8V8" fill="#fff" stroke="#71899b"/><text x="88" y="15" class="label">PostgreSQL</text><text x="88" y="34" class="body">projects, runs, conversations</text></g>
  <g transform="translate(500 1050)"><rect width="65" height="40" rx="6" fill="#fff" stroke="#71899b"/><circle cx="16" cy="14" r="5" fill="#2f70c9"/><circle cx="32" cy="14" r="5" fill="#16877c"/><circle cx="48" cy="14" r="5" fill="#c99431"/><path d="M13 28h40" stroke="#8298a7" stroke-width="4"/><text x="84" y="15" class="label">Vector Index</text><text x="84" y="34" class="body">chunks, embeddings, provenance</text></g>
  <g transform="translate(895 1050)"><path d="M0 8h63v34H0z" fill="#fff" stroke="#71899b"/><path d="M8 0h29l10 8H8z" fill="#dfeaf0" stroke="#71899b"/><text x="82" y="15" class="label">Artifact Store</text><text x="82" y="34" class="body">sources, analyses, drafts, exports</text></g>
  <g transform="translate(1290 1048)"><path d="M4 9l22-7 22 7v14c0 11-8 18-22 25-14-7-22-14-22-25z" fill="#fff" stroke="#16877c" stroke-width="2"/><path d="M15 25l8 8 15-19" fill="none" stroke="#16877c" stroke-width="3"/><text x="65" y="17" class="label">Security and Audit</text><text x="65" y="36" class="body">tenant scope, approvals, usage</text></g>
  <path d="M900 845V1010M257 810V1010M1542 810V1010" class="route"/>
  <text x="900" y="1113" text-anchor="middle" class="small">Solid navy: workflow · Solid teal: evidence flow · Coral dashed: verification feedback · Gray dashed: agent coordination and persistence</text>
</svg>

