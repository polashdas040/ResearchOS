<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">ResearchOS full system architecture</title>
  <desc id="desc">Vector architecture showing the user workspace, API services, research intelligence, agent runtime, infrastructure, storage, and external providers.</desc>
  <defs>
    <style>
      .title { font: 700 34px Inter, "Segoe UI", Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 16px Inter, "Segoe UI", Arial, sans-serif; fill: #5f6b76; }
      .band-title { font: 700 15px Inter, "Segoe UI", Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .band-copy { font: 500 13px Inter, "Segoe UI", Arial, sans-serif; fill: #eef8f5; }
      .node-title { font: 700 17px Inter, "Segoe UI", Arial, sans-serif; fill: #17212b; }
      .node-copy { font: 400 13px Inter, "Segoe UI", Arial, sans-serif; fill: #52606d; }
      .node-small { font: 600 12px Inter, "Segoe UI", Arial, sans-serif; fill: #41505f; }
      .legend { font: 500 12px Inter, "Segoe UI", Arial, sans-serif; fill: #52606d; }
      .node { fill: #ffffff; stroke: #c9d3dc; stroke-width: 1.5; rx: 8; }
      .node-teal { fill: #edf8f5; stroke: #16836f; stroke-width: 2; rx: 8; }
      .node-blue { fill: #eef5fb; stroke: #3978a8; stroke-width: 2; rx: 8; }
      .node-amber { fill: #fff7e7; stroke: #c6861a; stroke-width: 2; rx: 8; }
      .node-coral { fill: #fff0ed; stroke: #bf5a47; stroke-width: 2; rx: 8; }
      .node-violet { fill: #f5f0fa; stroke: #79559b; stroke-width: 2; rx: 8; }
      .arrow { fill: none; stroke: #667788; stroke-width: 2.2; marker-end: url(#arrow); }
      .evidence { fill: none; stroke: #16836f; stroke-width: 3; marker-end: url(#arrow-teal); }
      .async { fill: none; stroke: #c6861a; stroke-width: 2.4; stroke-dasharray: 8 6; marker-end: url(#arrow-amber); }
      .persist { fill: none; stroke: #3978a8; stroke-width: 2.2; stroke-dasharray: 3 5; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#667788"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16836f"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c6861a"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3978a8"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17212b" flood-opacity="0.10"/></filter>
  </defs>

  <rect width="1800" height="1160" fill="#f7f9fb"/>
  <rect x="0" y="0" width="1800" height="92" fill="#ffffff"/>
  <text x="52" y="48" class="title">ResearchOS Full Model Architecture</text>
  <text x="52" y="74" class="subtitle">Evidence-first, multi-agent scientific research and academic writing platform</text>
  <g transform="translate(1215 28)">
    <line x1="0" y1="8" x2="55" y2="8" class="arrow"/><text x="66" y="13" class="legend">request / response</text>
    <line x1="0" y1="34" x2="55" y2="34" class="evidence"/><text x="66" y="39" class="legend">evidence / citations</text>
    <line x1="245" y1="8" x2="300" y2="8" class="async"/><text x="311" y="13" class="legend">asynchronous job</text>
    <line x1="245" y1="34" x2="300" y2="34" class="persist"/><text x="311" y="39" class="legend">persistence / retrieval</text>
  </g>

  <!-- Experience plane -->
  <rect x="32" y="110" width="1736" height="150" fill="#e7f3f0" stroke="#bfded6" rx="8"/>
  <rect x="32" y="110" width="170" height="150" fill="#176f60" rx="8"/>
  <text x="58" y="145" class="band-title">EXPERIENCE</text>
  <text x="58" y="169" class="band-title">PLANE</text>
  <text x="58" y="207" class="band-copy">Researcher-facing</text>
  <text x="58" y="226" class="band-copy">Next.js interface</text>

