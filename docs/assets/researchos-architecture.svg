<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">ResearchOS closed-loop multi-agent research architecture</title>
  <desc id="desc">Publication-ready architecture showing human-guided orchestration, evidence ingestion and hybrid retrieval, a four-stage multi-agent scientific reasoning loop, claim verification, citation-aware writing, and a shared provenance data plane.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16324f"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#138a7e"/></marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d5654a"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#16324f" flood-opacity="0.10"/></filter>
    <style>
      .title{font:700 30px Arial,Helvetica,sans-serif;fill:#10283f}.subtitle{font:400 14px Arial,Helvetica,sans-serif;fill:#5b6d7f}
      .eyebrow{font:700 11px Arial,Helvetica,sans-serif;letter-spacing:1.2px;fill:#5b6d7f}.section{font:700 17px Arial,Helvetica,sans-serif;fill:#10283f}
      .node-title{font:700 13px Arial,Helvetica,sans-serif;fill:#10283f}.node-copy{font:400 11.5px Arial,Helvetica,sans-serif;fill:#5b6d7f}
      .stage-no{font:700 11px Arial,Helvetica,sans-serif;fill:#fff}.stage-title{font:700 16px Arial,Helvetica,sans-serif;fill:#10283f}
      .agent{font:600 12px Arial,Helvetica,sans-serif;fill:#10283f}.tiny{font:400 10.5px Arial,Helvetica,sans-serif;fill:#607487}
      .pill{font:600 10.5px Arial,Helvetica,sans-serif;fill:#27445f}.center-title{font:700 17px Arial,Helvetica,sans-serif;fill:#fff}.center-copy{font:400 11px Arial,Helvetica,sans-serif;fill:#dce8f2}
      .panel{fill:#fff;stroke:#c5d1dc;stroke-width:1.15}.panel-soft{fill:#f7f9fb;stroke:#d5dee6;stroke-width:1.05}
      .node{fill:#fff;stroke:#bdcad5;stroke-width:1.1}.teal-node{fill:#eef9f7;stroke:#70afa8;stroke-width:1.2}.blue-node{fill:#f1f5ff;stroke:#88a9ec;stroke-width:1.2}
      .amber-node{fill:#fff8e8;stroke:#d8b766;stroke-width:1.2}.coral-node{fill:#fff3ef;stroke:#d99887;stroke-width:1.2}
      .primary{fill:none;stroke:#16324f;stroke-width:1.8;marker-end:url(#arrow-navy)}.evidence{fill:none;stroke:#138a7e;stroke-width:1.9;marker-end:url(#arrow-teal)}
      .feedback{fill:none;stroke:#d5654a;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#arrow-coral)}.data-link{fill:none;stroke:#8495a5;stroke-width:1.1;stroke-dasharray:4 4}
      .cycle{fill:none;stroke:#7f91a1;stroke-width:2.2;marker-end:url(#arrow-navy)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="800" y="40" text-anchor="middle" class="title">ResearchOS: Closed-Loop, Evidence-Grounded Research Architecture</text>
  <text x="800" y="65" text-anchor="middle" class="subtitle">Human-guided orchestration, adaptive retrieval, specialized scientific agents, and claim-level provenance</text>
  <rect x="70" y="91" width="1460" height="116" rx="8" fill="#f3f6f8" stroke="#c5d1dc"/>
  <text x="91" y="115" class="eyebrow">HUMAN-GUIDED CONTROL PLANE</text>
  <rect x="92" y="130" width="255" height="55" rx="6" class="node" filter="url(#shadow)"/><circle cx="118" cy="157" r="12" fill="#16324f"/><text x="118" y="161" text-anchor="middle" class="stage-no">1</text><text x="140" y="152" class="node-title">Research Goal + Project Context</text><text x="140" y="170" class="node-copy">prompt, files, history, constraints</text>
  <path d="M347 157H382" class="primary"/>
  <rect x="382" y="130" width="235" height="55" rx="6" class="node" filter="url(#shadow)"/><circle cx="408" cy="157" r="12" fill="#2f6fed"/><text x="408" y="161" text-anchor="middle" class="stage-no">2</text><text x="430" y="152" class="node-title">Context Compiler</text><text x="430" y="170" class="node-copy">tenant scope and working memory</text>
  <path d="M617 157H652" class="primary"/>
  <rect x="652" y="130" width="300" height="55" rx="6" class="node" filter="url(#shadow)"/><circle cx="678" cy="157" r="12" fill="#138a7e"/><text x="678" y="161" text-anchor="middle" class="stage-no">3</text><text x="700" y="152" class="node-title">Dynamic Planner + Task Scheduler</text><text x="700" y="170" class="node-copy">workflow graph, dependencies, retry, resume</text>
  <path d="M952 157H987" class="primary"/>
  <rect x="987" y="130" width="250" height="55" rx="6" class="node" filter="url(#shadow)"/><circle cx="1013" cy="157" r="12" fill="#c68a14"/><text x="1013" y="161" text-anchor="middle" class="stage-no">4</text><text x="1035" y="152" class="node-title">Agent + Tool Router</text><text x="1035" y="170" class="node-copy">models, search, code, MCP tools</text>
  <path d="M1237 157H1272" class="primary"/>
  <rect x="1272" y="130" width="236" height="55" rx="6" class="node" filter="url(#shadow)"/><circle cx="1298" cy="157" r="12" fill="#d5654a"/><text x="1298" y="161" text-anchor="middle" class="stage-no">5</text><text x="1320" y="152" class="node-title">Run Monitor + Checkpoints</text><text x="1320" y="170" class="node-copy">approval, status, audit, cancellation</text>

  <rect x="70" y="231" width="350" height="547" rx="8" class="panel"/>
  <text x="92" y="260" class="eyebrow">EVIDENCE FOUNDATION</text><text x="92" y="285" class="section">Private and scholarly knowledge</text>
  <rect x="92" y="306" width="145" height="64" rx="6" class="panel-soft"/><text x="108" y="331" class="node-title">Project Library</text><text x="108" y="349" class="node-copy">PDF, DOCX, text, data</text>
  <rect x="252" y="306" width="145" height="64" rx="6" class="panel-soft"/><text x="268" y="331" class="node-title">Scholarly Search</text><text x="268" y="349" class="node-copy">papers and metadata</text>
  <path d="M165 370V399H245" class="evidence"/><path d="M325 370V399H245" class="evidence"/>
  <rect x="92" y="399" width="305" height="68" rx="6" class="teal-node"/><text x="245" y="425" text-anchor="middle" class="node-title">Document Intelligence</text><text x="245" y="444" text-anchor="middle" class="node-copy">parse - normalize - semantic chunk - embed</text>
  <path d="M245 467V494" class="evidence"/>
  <rect x="92" y="494" width="305" height="82" rx="6" class="teal-node"/><text x="245" y="521" text-anchor="middle" class="node-title">Hybrid Retrieval</text><text x="245" y="540" text-anchor="middle" class="node-copy">dense + lexical search - reciprocal-rank fusion</text><text x="245" y="558" text-anchor="middle" class="node-copy">project and tenant scoped</text>
  <path d="M245 576V603" class="evidence"/>
  <rect x="92" y="603" width="305" height="73" rx="6" fill="#16324f" stroke="#16324f"/><text x="245" y="631" text-anchor="middle" class="center-title">Traceable Evidence Pack</text><text x="245" y="651" text-anchor="middle" class="center-copy">ranked passages + source/page/chunk IDs</text>
  <rect x="105" y="698" width="92" height="28" rx="14" fill="#edf2f6"/><text x="151" y="716" text-anchor="middle" class="pill">relevance</text><rect x="201" y="698" width="92" height="28" rx="14" fill="#edf2f6"/><text x="247" y="716" text-anchor="middle" class="pill">diversity</text><rect x="297" y="698" width="88" height="28" rx="14" fill="#edf2f6"/><text x="341" y="716" text-anchor="middle" class="pill">provenance</text>

  <rect x="445" y="231" width="725" height="547" rx="8" fill="#fbfcfd" stroke="#c5d1dc"/>
  <text x="468" y="260" class="eyebrow">MULTI-AGENT SCIENTIFIC REASONING LOOP</text><text x="468" y="285" class="section">Discover, propose, evaluate, and revise</text>
  <rect x="485" y="314" width="252" height="142" rx="8" class="blue-node" filter="url(#shadow)"/><circle cx="510" cy="339" r="14" fill="#2f6fed"/><text x="510" y="343" text-anchor="middle" class="stage-no">1</text><text x="534" y="344" class="stage-title">Discover</text><text x="509" y="375" class="agent">Literature Agent</text><text x="509" y="396" class="agent">Evidence Mapping</text><text x="509" y="417" class="agent">Gap Analysis</text><text x="509" y="439" class="tiny">search, deduplicate, synthesize</text>
  <rect x="855" y="314" width="270" height="142" rx="8" class="amber-node" filter="url(#shadow)"/><circle cx="880" cy="339" r="14" fill="#c68a14"/><text x="880" y="343" text-anchor="middle" class="stage-no">2</text><text x="904" y="344" class="stage-title">Hypothesize</text><text x="879" y="375" class="agent">Hypothesis Generator</text><text x="879" y="396" class="agent">Hypothesis Lineage</text><text x="879" y="417" class="agent">Candidate Tournament</text><text x="879" y="439" class="tiny">falsifiable, evidence-linked proposals</text>
  <rect x="855" y="578" width="270" height="156" rx="8" class="coral-node" filter="url(#shadow)"/><circle cx="880" cy="603" r="14" fill="#d5654a"/><text x="880" y="607" text-anchor="middle" class="stage-no">3</text><text x="904" y="608" class="stage-title">Evaluate</text><text x="879" y="639" class="agent">Novelty Auditor + Prior Art</text><text x="879" y="660" class="agent">Feasibility Agent</text><text x="879" y="681" class="agent">Code + Experiment Runner</text><text x="879" y="704" class="tiny">testability, risk, methods, results</text>
  <rect x="485" y="578" width="252" height="156" rx="8" class="teal-node" filter="url(#shadow)"/><circle cx="510" cy="603" r="14" fill="#138a7e"/><text x="510" y="607" text-anchor="middle" class="stage-no">4</text><text x="534" y="608" class="stage-title">Critique + Synthesize</text><text x="509" y="639" class="agent">Scientific Critic</text><text x="509" y="660" class="agent">Statistical Reviewer</text><text x="509" y="681" class="agent">Academic Writing Agent</text><text x="509" y="704" class="tiny">accept, revise, reject, or replan</text>
  <circle cx="805" cy="521" r="90" fill="#16324f" filter="url(#shadow)"/><text x="805" y="491" text-anchor="middle" class="center-title">Shared Research</text><text x="805" y="510" text-anchor="middle" class="center-title">State</text><text x="805" y="532" text-anchor="middle" class="center-copy">plans - observations - evidence</text><text x="805" y="551" text-anchor="middle" class="center-copy">claims - artifacts - decisions</text>
  <path d="M737 372C785 331 812 330 855 372" class="cycle"/><path d="M1055 456C1108 488 1110 535 1055 578" class="cycle"/><path d="M855 686C805 728 784 728 737 686" class="cycle"/><path d="M555 578C497 543 498 492 555 456" class="cycle"/>
  <path d="M420 639H455V506H715" class="evidence"/><text x="575" y="495" text-anchor="middle" class="tiny" fill="#138a7e">evidence on demand</text>
  <path d="M752 462L698 423" class="data-link"/><path d="M858 462L914 423" class="data-link"/><path d="M858 579L914 621" class="data-link"/><path d="M752 579L698 621" class="data-link"/>

  <rect x="1195" y="231" width="335" height="547" rx="8" class="panel"/>
  <text x="1217" y="260" class="eyebrow">TRUST AND DELIVERY</text><text x="1217" y="285" class="section">Only supported claims advance</text>
  <rect x="1217" y="312" width="291" height="72" rx="6" class="coral-node"/><text x="1241" y="340" class="node-title">Claim Verification</text><text x="1241" y="359" class="node-copy">support, contradiction, experiment provenance</text>
  <path d="M1363 384V411" class="primary"/><rect x="1217" y="411" width="291" height="72" rx="6" class="amber-node"/><text x="1241" y="439" class="node-title">Citation Validation</text><text x="1241" y="458" class="node-copy">claim-to-source integrity and sequence</text>
  <path d="M1363 483V510" class="primary"/><rect x="1217" y="510" width="291" height="83" rx="6" class="blue-node"/><text x="1241" y="538" class="node-title">Context-Aware Drafting</text><text x="1241" y="557" class="node-copy">document history + selected citation style</text><text x="1241" y="576" class="node-copy">IEEE - APA 7 - Harvard - MLA 9</text>
  <path d="M1363 593V620" class="primary"/><rect x="1217" y="620" width="291" height="71" rx="6" fill="#16324f" stroke="#16324f"/><text x="1363" y="648" text-anchor="middle" class="center-title">Research Deliverables</text><text x="1363" y="668" text-anchor="middle" class="center-copy">draft + references + DOCX/PDF export</text>
  <rect x="1240" y="713" width="246" height="36" rx="18" fill="#eef3f6" stroke="#c5d1dc"/><text x="1363" y="736" text-anchor="middle" class="pill">researcher review and revision</text>
  <path d="M895 521H1180V348H1217" class="primary"/><path d="M1217 348H1164V290H807V314" class="feedback"/><text x="1014" y="282" text-anchor="middle" class="tiny" fill="#d5654a">unsupported or contradicted claims trigger retrieval, revision, or replanning</text>

  <rect x="70" y="811" width="1460" height="116" rx="8" fill="#f3f6f8" stroke="#c5d1dc"/>
  <text x="91" y="837" class="eyebrow">PERSISTENT DATA, MEMORY, AND GOVERNANCE PLANE</text>
  <rect x="92" y="854" width="213" height="50" rx="6" class="node"/><text x="199" y="875" text-anchor="middle" class="node-title">PostgreSQL Research State</text><text x="199" y="892" text-anchor="middle" class="tiny">projects, runs, conversations</text>
  <rect x="326" y="854" width="213" height="50" rx="6" class="node"/><text x="433" y="875" text-anchor="middle" class="node-title">Document + Artifact Store</text><text x="433" y="892" text-anchor="middle" class="tiny">sources, drafts, results, exports</text>
  <rect x="560" y="854" width="213" height="50" rx="6" class="node"/><text x="667" y="875" text-anchor="middle" class="node-title">Vector + Lexical Index</text><text x="667" y="892" text-anchor="middle" class="tiny">embeddings and searchable chunks</text>
  <rect x="794" y="854" width="213" height="50" rx="6" class="node"/><text x="901" y="875" text-anchor="middle" class="node-title">Evidence + Lineage Graph</text><text x="901" y="892" text-anchor="middle" class="tiny">claims, citations, ancestry</text>
  <rect x="1028" y="854" width="213" height="50" rx="6" class="node"/><text x="1135" y="875" text-anchor="middle" class="node-title">Model + Tool Gateways</text><text x="1135" y="892" text-anchor="middle" class="tiny">LLMs, search, code, MCP</text>
  <rect x="1262" y="854" width="246" height="50" rx="6" class="node"/><text x="1385" y="875" text-anchor="middle" class="node-title">Tenant Security + Audit</text><text x="1385" y="892" text-anchor="middle" class="tiny">authorization, approvals, usage</text>
  <path d="M245 778V811" class="data-link"/><path d="M807 778V811" class="data-link"/><path d="M1363 778V811" class="data-link"/>
  <line x1="70" y1="950" x2="1530" y2="950" stroke="#d8e0e7"/>
  <path d="M88 965H121" class="primary"/><text x="130" y="969" class="tiny">primary workflow</text><path d="M276 965H309" class="evidence"/><text x="318" y="969" class="tiny">evidence flow</text><path d="M443 965H476" class="feedback"/><text x="485" y="969" class="tiny">quality-control feedback</text><path d="M688 965H721" class="data-link"/><text x="730" y="969" class="tiny">persistence and shared state</text>
  <text x="1510" y="969" text-anchor="end" class="tiny">Modes: deep research - idea discovery - paper review - reproduction - research debugging</text>
</svg>

