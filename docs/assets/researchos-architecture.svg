<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">ResearchOS evidence-grounded multi-agent architecture</title>
  <desc id="desc">Paper-friendly architecture showing research inputs, document intelligence, hybrid retrieval, specialized research agents, verification, academic outputs, orchestration, and shared research memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
    <style>
      .title{font:700 28px Arial,Helvetica,sans-serif;fill:#17212b}.subtitle{font:400 14px Arial,Helvetica,sans-serif;fill:#536273}
      .band-title{font:700 15px Arial,Helvetica,sans-serif;fill:#17212b}.stage-no{font:700 12px Arial,Helvetica,sans-serif;fill:#fff}
      .stage-title{font:700 16px Arial,Helvetica,sans-serif;fill:#17212b}.node-title{font:700 13px Arial,Helvetica,sans-serif;fill:#17212b}
      .node-copy{font:400 11.5px Arial,Helvetica,sans-serif;fill:#536273}.tiny{font:400 10.5px Arial,Helvetica,sans-serif;fill:#5f6f7e}
      .agent{font:600 11.5px Arial,Helvetica,sans-serif;fill:#17212b}.output{font:600 12px Arial,Helvetica,sans-serif;fill:#17212b}
      .box{fill:#fff;stroke:#9aa9b7;stroke-width:1.25}.soft{fill:#f7f9fa;stroke:#c3ccd5;stroke-width:1.1}
      .teal{fill:#eef8f6;stroke:#3a8f86;stroke-width:1.4}.control{fill:#f1f5f6;stroke:#7f919e;stroke-width:1.2}
      .arrow{fill:none;stroke:#334155;stroke-width:1.6;marker-end:url(#arrow)}.feedback{fill:none;stroke:#0f766e;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#arrow-teal)}
      .memory-link{fill:none;stroke:#758697;stroke-width:1.1;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#fff"/>
  <text x="700" y="42" text-anchor="middle" class="title">ResearchOS: Evidence-Grounded Multi-Agent Research Architecture</text>
  <text x="700" y="67" text-anchor="middle" class="subtitle">Iterative evidence acquisition, scientific reasoning, verification, and citation-aware academic writing</text>

  <rect x="55" y="92" width="1290" height="105" rx="7" class="control"/>
  <text x="77" y="119" class="band-title">ORCHESTRATION AND CONTROL</text>
  <rect x="77" y="135" width="210" height="42" rx="4" class="box"/><text x="182" y="153" text-anchor="middle" class="node-title">Context Compiler</text><text x="182" y="169" text-anchor="middle" class="tiny">goal, history, tenant scope</text>
  <path d="M287 156H330" class="arrow"/>
  <rect x="330" y="135" width="210" height="42" rx="4" class="box"/><text x="435" y="153" text-anchor="middle" class="node-title">Dynamic Planner</text><text x="435" y="169" text-anchor="middle" class="tiny">task graph and dependencies</text>
  <path d="M540 156H583" class="arrow"/>
  <rect x="583" y="135" width="210" height="42" rx="4" class="box"/><text x="688" y="153" text-anchor="middle" class="node-title">Task Scheduler</text><text x="688" y="169" text-anchor="middle" class="tiny">execution, retry, progress</text>
  <path d="M793 156H836" class="arrow"/>
  <rect x="836" y="135" width="210" height="42" rx="4" class="box"/><text x="941" y="153" text-anchor="middle" class="node-title">Tool / Model Gateway</text><text x="941" y="169" text-anchor="middle" class="tiny">LLMs, search, code sandbox</text>
  <rect x="1092" y="135" width="231" height="42" rx="4" class="box"/><text x="1208" y="153" text-anchor="middle" class="node-title">Policy and Run Monitor</text><text x="1208" y="169" text-anchor="middle" class="tiny">authorization, audit, status</text>

  <text x="55" y="231" class="band-title">EVIDENCE-GROUNDED RESEARCH PIPELINE</text>
  <rect x="55" y="251" width="188" height="362" rx="7" class="box"/>
  <circle cx="82" cy="278" r="14" fill="#0f766e"/><text x="82" y="282" text-anchor="middle" class="stage-no">1</text><text x="106" y="284" class="stage-title">Research Inputs</text>
  <rect x="73" y="310" width="152" height="64" rx="4" class="soft"/><text x="89" y="334" class="node-title">Researcher</text><text x="89" y="352" class="node-copy">topic, question, criteria</text>
  <rect x="73" y="388" width="152" height="64" rx="4" class="soft"/><text x="89" y="412" class="node-title">Private Sources</text><text x="89" y="430" class="node-copy">PDF, DOCX, text, data</text>
  <rect x="73" y="466" width="152" height="64" rx="4" class="soft"/><text x="89" y="490" class="node-title">Scholarly Search</text><text x="89" y="508" class="node-copy">papers and metadata</text>
  <text x="149" y="572" text-anchor="middle" class="tiny">Project- and tenant-scoped</text><text x="149" y="589" text-anchor="middle" class="tiny">research context</text>

  <rect x="275" y="251" width="205" height="362" rx="7" class="box"/>
  <circle cx="302" cy="278" r="14" fill="#0f766e"/><text x="302" y="282" text-anchor="middle" class="stage-no">2</text><text x="326" y="284" class="stage-title">Document Intelligence</text>
  <rect x="294" y="310" width="167" height="50" rx="4" class="soft"/><text x="378" y="332" text-anchor="middle" class="node-title">Parse and Normalize</text><text x="378" y="349" text-anchor="middle" class="tiny">text + metadata</text><path d="M378 360V387" class="arrow"/>
  <rect x="294" y="387" width="167" height="50" rx="4" class="soft"/><text x="378" y="409" text-anchor="middle" class="node-title">Semantic Chunking</text><text x="378" y="426" text-anchor="middle" class="tiny">section-aware segments</text><path d="M378 437V464" class="arrow"/>
  <rect x="294" y="464" width="167" height="50" rx="4" class="soft"/><text x="378" y="486" text-anchor="middle" class="node-title">Embed and Index</text><text x="378" y="503" text-anchor="middle" class="tiny">vectors + lexical terms</text>
  <rect x="294" y="538" width="167" height="48" rx="4" class="teal"/><text x="378" y="559" text-anchor="middle" class="node-title">Provenance Binding</text><text x="378" y="576" text-anchor="middle" class="tiny">source, page, chunk ID</text>

  <rect x="512" y="251" width="205" height="362" rx="7" class="box"/>
  <circle cx="539" cy="278" r="14" fill="#0f766e"/><text x="539" y="282" text-anchor="middle" class="stage-no">3</text><text x="563" y="284" class="stage-title">Hybrid Retrieval</text>
  <rect x="531" y="310" width="167" height="50" rx="4" class="soft"/><text x="615" y="332" text-anchor="middle" class="node-title">Query Expansion</text><text x="615" y="349" text-anchor="middle" class="tiny">goal and gap aware</text><path d="M615 360V387" class="arrow"/>
  <rect x="531" y="387" width="167" height="50" rx="4" class="soft"/><text x="615" y="409" text-anchor="middle" class="node-title">Dense + Sparse Search</text><text x="615" y="426" text-anchor="middle" class="tiny">semantic and lexical</text><path d="M615 437V464" class="arrow"/>
  <rect x="531" y="464" width="167" height="50" rx="4" class="soft"/><text x="615" y="486" text-anchor="middle" class="node-title">Fusion and Reranking</text><text x="615" y="503" text-anchor="middle" class="tiny">relevance + diversity</text>
  <rect x="531" y="538" width="167" height="48" rx="4" class="teal"/><text x="615" y="559" text-anchor="middle" class="node-title">Evidence Pack</text><text x="615" y="576" text-anchor="middle" class="tiny">ranked, traceable claims</text>

  <rect x="749" y="251" width="335" height="362" rx="7" class="teal"/>
  <circle cx="776" cy="278" r="14" fill="#0f766e"/><text x="776" y="282" text-anchor="middle" class="stage-no">4</text><text x="800" y="284" class="stage-title">Specialized Research Agents</text>
  <rect x="768" y="310" width="142" height="56" rx="4" class="box"/><text x="839" y="333" text-anchor="middle" class="agent">Literature Agent</text><text x="839" y="350" text-anchor="middle" class="tiny">search and synthesis</text>
  <rect x="923" y="310" width="142" height="56" rx="4" class="box"/><text x="994" y="333" text-anchor="middle" class="agent">Gap Analysis</text><text x="994" y="350" text-anchor="middle" class="tiny">unresolved questions</text>
  <rect x="768" y="381" width="142" height="56" rx="4" class="box"/><text x="839" y="404" text-anchor="middle" class="agent">Hypothesis Agent</text><text x="839" y="421" text-anchor="middle" class="tiny">candidate generation</text>
  <rect x="923" y="381" width="142" height="56" rx="4" class="box"/><text x="994" y="404" text-anchor="middle" class="agent">Novelty Agent</text><text x="994" y="421" text-anchor="middle" class="tiny">prior-art comparison</text>
  <rect x="768" y="452" width="142" height="56" rx="4" class="box"/><text x="839" y="475" text-anchor="middle" class="agent">Feasibility Agent</text><text x="839" y="492" text-anchor="middle" class="tiny">resources and constraints</text>
  <rect x="923" y="452" width="142" height="56" rx="4" class="box"/><text x="994" y="475" text-anchor="middle" class="agent">Scientific Critic</text><text x="994" y="492" text-anchor="middle" class="tiny">assumptions and validity</text>
  <rect x="768" y="523" width="142" height="56" rx="4" class="box"/><text x="839" y="546" text-anchor="middle" class="agent">Statistical Reviewer</text><text x="839" y="563" text-anchor="middle" class="tiny">methods and power</text>
  <rect x="923" y="523" width="142" height="56" rx="4" class="box"/><text x="994" y="546" text-anchor="middle" class="agent">Tournament + Code</text><text x="994" y="563" text-anchor="middle" class="tiny">rank and test candidates</text>
  <path d="M910 338H923" class="arrow"/><path d="M994 366V381" class="arrow"/><path d="M923 409H910" class="arrow"/><path d="M839 437V452" class="arrow"/><path d="M910 480H923" class="arrow"/><path d="M994 508V523" class="arrow"/>

  <rect x="1116" y="251" width="229" height="362" rx="7" class="box"/>
  <circle cx="1143" cy="278" r="14" fill="#0f766e"/><text x="1143" y="282" text-anchor="middle" class="stage-no">5</text><text x="1167" y="284" class="stage-title">Verify and Write</text>
  <rect x="1135" y="310" width="191" height="58" rx="4" class="soft"/><text x="1231" y="333" text-anchor="middle" class="node-title">Claim Verification</text><text x="1231" y="351" text-anchor="middle" class="tiny">support and contradiction</text><path d="M1231 368V393" class="arrow"/>
  <rect x="1135" y="393" width="191" height="58" rx="4" class="soft"/><text x="1231" y="416" text-anchor="middle" class="node-title">Citation Validation</text><text x="1231" y="434" text-anchor="middle" class="tiny">source-to-claim integrity</text><path d="M1231 451V476" class="arrow"/>
  <rect x="1135" y="476" width="191" height="58" rx="4" class="soft"/><text x="1231" y="499" text-anchor="middle" class="node-title">Academic Writing</text><text x="1231" y="517" text-anchor="middle" class="tiny">context-aware drafting</text>
  <rect x="1135" y="552" width="191" height="42" rx="4" class="teal"/><text x="1231" y="578" text-anchor="middle" class="output">Draft + references + export</text>

  <path d="M243 432H275" class="arrow"/><path d="M480 432H512" class="arrow"/><path d="M717 432H749" class="arrow"/><path d="M1084 432H1116" class="arrow"/>
  <path d="M688 177V220H917V251" class="memory-link"/><path d="M941 177V230H1231V251" class="memory-link"/>
  <path d="M1231 310V223H615V251" class="feedback"/><text x="923" y="216" text-anchor="middle" class="tiny" fill="#0f766e">verification feedback triggers retrieval or replanning</text>

  <rect x="55" y="652" width="1290" height="124" rx="7" class="control"/>
  <text x="77" y="680" class="band-title">SHARED RESEARCH MEMORY AND PERSISTENCE</text>
  <rect x="77" y="699" width="224" height="51" rx="4" class="box"/><text x="189" y="721" text-anchor="middle" class="node-title">Research State</text><text x="189" y="738" text-anchor="middle" class="tiny">plans, runs, conversations</text>
  <rect x="325" y="699" width="224" height="51" rx="4" class="box"/><text x="437" y="721" text-anchor="middle" class="node-title">Evidence Store</text><text x="437" y="738" text-anchor="middle" class="tiny">documents, chunks, provenance</text>
  <rect x="573" y="699" width="224" height="51" rx="4" class="box"/><text x="685" y="721" text-anchor="middle" class="node-title">Vector and Search Index</text><text x="685" y="738" text-anchor="middle" class="tiny">embeddings and lexical index</text>
  <rect x="821" y="699" width="224" height="51" rx="4" class="box"/><text x="933" y="721" text-anchor="middle" class="node-title">Hypothesis Lineage</text><text x="933" y="738" text-anchor="middle" class="tiny">versions, ancestry, decisions</text>
  <rect x="1069" y="699" width="254" height="51" rx="4" class="box"/><text x="1196" y="721" text-anchor="middle" class="node-title">Research Artifacts</text><text x="1196" y="738" text-anchor="middle" class="tiny">drafts, citations, results, exports</text>
  <path d="M149 613V699" class="memory-link"/><path d="M378 613V699" class="memory-link"/><path d="M615 613V699" class="memory-link"/><path d="M917 613V699" class="memory-link"/><path d="M1231 613V699" class="memory-link"/>
  <text x="700" y="806" text-anchor="middle" class="tiny">Solid arrows: primary data flow   ·   Dashed teal arrow: quality-control feedback   ·   Dashed gray lines: control and persistence</text>
</svg>

