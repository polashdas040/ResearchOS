  <g filter="url(#shadow)"><rect x="235" y="692" width="210" height="62" class="node-violet"/></g>
  <text x="259" y="720" class="node-title">Context Compiler</text><text x="259" y="741" class="node-copy">History + evidence + memory</text>
  <g filter="url(#shadow)"><rect x="485" y="692" width="210" height="62" class="node-violet"/></g>
  <text x="509" y="720" class="node-title">Planner &amp; Scheduler</text><text x="509" y="741" class="node-copy">LangGraph runs and retries</text>
  <g filter="url(#shadow)"><rect x="735" y="674" width="380" height="80" class="node-violet"/></g>
